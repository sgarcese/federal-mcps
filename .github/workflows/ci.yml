name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id `ci` is the required status check on `main` (CLAUDE.md, merge
  # discipline). Each gate is its own step so a failure names itself.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the whole history so a key that was committed and
          # later removed still fails the gate.
          fetch-depth: 0

      # Secret scan first: nothing else should run if a credential is in the tree.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version
          gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Contract tests
        run: npm run test:contract

      - name: Build
        run: npm run build

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Placeholder Lambda zip for terraform validate
        run: |
          python3 -c "import zipfile,os; os.makedirs('packages/server-bls/dist',exist_ok=True); zipfile.ZipFile('packages/server-bls/dist/lambda.zip','w').close()"

      - name: Terraform validate
        run: |
          for root in terraform/bootstrap terraform/modules/github-oidc-deploy-role terraform/modules/bls-server terraform/instances/dev; do
            echo "== $root"
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
          done

      - name: Terraform test
        run: |
          for root in terraform/modules/github-oidc-deploy-role terraform/modules/bls-server terraform/instances/dev; do
            echo "== $root"
            terraform -chdir="$root" test
          done

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --chdir=terraform
