name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id `ci` is the required status check on `main` (CLAUDE.md, merge
  # discipline). Each gate is its own step so a failure names itself.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history so a key that was committed and
          # later removed still fails the gate.
          fetch-depth: 0

      # Secret scan first: nothing else should run if a credential is in the tree.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version
          gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # A high or critical advisory in a production dependency blocks the merge (#279); the full
      # audit, dev tooling included, is reported without blocking.
      - name: npm audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (all, report only)
        continue-on-error: true
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Contract tests
        run: npm run test:contract

      - name: Build
        run: npm run build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Placeholder Lambda zip for terraform validate
        run: |
          python3 -c "import zipfile,os; os.makedirs('packages/server-bls/dist',exist_ok=True); zipfile.ZipFile('packages/server-bls/dist/lambda.zip','w').close()"
          python3 -c "import zipfile,os; os.makedirs('packages/server-geo/dist',exist_ok=True); zipfile.ZipFile('packages/server-geo/dist/lambda.zip','w').close()"
          python3 -c "import zipfile,os; os.makedirs('packages/server-census/dist',exist_ok=True); zipfile.ZipFile('packages/server-census/dist/lambda.zip','w').close()"
          python3 -c "import zipfile,os; os.makedirs('packages/server-hud/dist',exist_ok=True); zipfile.ZipFile('packages/server-hud/dist/lambda.zip','w').close()"
          python3 -c "import zipfile,os; os.makedirs('packages/server-bea/dist',exist_ok=True); zipfile.ZipFile('packages/server-bea/dist/lambda.zip','w').close()"
          python3 -c "import zipfile,os; os.makedirs('build',exist_ok=True); zipfile.ZipFile('build/opencontext-lambda.zip','w').close()"

      - name: Terraform validate
        run: |
          for root in terraform/modules/bls-server terraform/modules/geo-server terraform/modules/census-server terraform/modules/hud-server terraform/modules/bea-server terraform/modules/opencontext-portal terraform/instances/dev; do
            echo "== $root"
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
          done

      - name: Terraform test
        run: |
          for root in terraform/modules/bls-server terraform/modules/geo-server terraform/modules/census-server terraform/modules/hud-server terraform/modules/bea-server terraform/modules/opencontext-portal terraform/instances/dev; do
            echo "== $root"
            terraform -chdir="$root" test
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --chdir=terraform

      # The OpenContext portal's Python dependencies (#277): audit the hash-pinned lock, then prove
      # it is enough to import the Lambda handler on the Lambda's Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: OpenContext portal dependencies — pip-audit (blocking)
        run: pipx run pip-audit==2.10.1 -r opencontext.requirements.lock --require-hashes --no-deps --disable-pip --progress-spinner off

      - name: OpenContext portal — install the lock and import the Lambda handler
        env:
          PYTHON: python3.11
        run: scripts/check-opencontext-lock.sh
