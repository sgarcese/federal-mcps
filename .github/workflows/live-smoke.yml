name: Live smoke

# Runs the tests that call real agency APIs. Never a merge gate (CLAUDE.md,
# project rules): scheduled weekly so a change in an agency's response shape is
# noticed, and on demand. Live tests are describe.runIf(LIVE_TESTS === "1")
# blocks named "… LIVE"; the filter selects only those (#390).
on:
  schedule:
    - cron: "17 11 * * 1" # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_TESTS: "1"
      FIXTURES: "off"
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Packages resolve each other through dist/, which only `tsc -b` creates; the ci job gets it
      # from its typecheck step, this job has none (#390).
      - name: Build
        run: npm run build

      - name: Live tests
        run: npx vitest run --project unit --testNamePattern "LIVE"
