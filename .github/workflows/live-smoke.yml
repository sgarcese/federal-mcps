name: Live smoke

# Runs the tests that call real agency APIs. Never a merge gate (CLAUDE.md,
# project rules): scheduled weekly so a change in an agency's response shape is
# noticed, and on demand. Until M3 adds live tests this job is a no-op that
# proves the wiring.
on:
  schedule:
    - cron: "17 11 * * 1" # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_TESTS: "1"
      FIXTURES: "off"
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Live tests
        run: npx vitest run --passWithNoTests --project unit -- --testNamePattern "live:"
