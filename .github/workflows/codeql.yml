name: CodeQL

# Code scanning for the TypeScript packages and scripts (#279, docs/spikes/security-review-2026-09.md
# decision 6). Results appear in the repository's Security tab. Not a required check: the owner
# decides whether findings block merges.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1" # Mondays 06:37 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
